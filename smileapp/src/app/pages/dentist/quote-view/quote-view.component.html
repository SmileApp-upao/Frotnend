<div class="container py-4 d-flex justify-content-center align-items-center" style="min-height: 100vh;">
    
    <div class="row w-100">
        <div class="col-12 mb-4">
            <a href="/dentist/calendar" class="btn">
                <i class="fa-solid fa-angle-left"></i> Volver
            </a>
        </div>
        <!-- Tarjeta con los detalles del paciente (ocupa 6/12 de la altura) -->
        <div class="col-md-6 d-flex justify-content-center align-items-center">
            <div class="card shadow-sm h-100 w-100 p-4">
                <div class="card-body d-flex flex-column">
                    <!-- Foto de perfil y nombre -->
                    <div class="row mb-4">
                        <div class="col-md-6 text-center">
                            <img [src]="patientImage" alt="Imagen del paciente" class="img-fluid rounded-circle">
                        </div>
                        <div class="col-md-8">
                            <h5 class="card-title">{{ patientDetails?.name }} {{ patientDetails?.lastname }}</h5>
                        </div>
                    </div>

                    <!-- Detalles de la cita con padding interno para texto -->
                    <div class="row mb-4 flex-grow-1">
                        <div class="col p-4">
                            <p><strong>Motivo:</strong></p>
                            <p>{{ reason }}</p>
                        </div>
                    </div>

                    <div class="row mb-4 flex-grow-1">
                        <div class="row p-4">
                            <p><strong>Fecha:</strong></p>
                            <p>{{ appointmentDate }}</p>
                            <p><strong>Hora:</strong></p>
                            <p>{{ appointmentTime }}</p>
                        </div>
                    </div>

                    <!-- Botón para descargar PDF -->
                    <div class="row mt-auto">
                        <div class="col text-center">
                            <button class="btn btn-dark" (click)="downloadPdf()">Descargar Reporte</button>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <!-- Espacio para imágenes adjuntas (ocupa 6/12 de la altura) -->
        <div class="col-md-6 d-flex justify-content-center align-items-center">
            <h2 class="h5 text-secondary text-center">Imágenes Adjuntas</h2>
            <div class="row">
                <div class="col-md-12 mb-3">
                    <img [src]="" alt="Imagen adjunta" class="img-fluid rounded shadow">
                </div>
            </div>
        </div>
    </div>
</div>
